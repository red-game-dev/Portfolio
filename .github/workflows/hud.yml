name: HUD layout

# The voyage's HUD measured in a real browser on every preview Vercel deploys: the HUD lab (/hud-lab/) at every screen
# size, failing on any two panels that overlap or one that leaves the screen (e2e/hud.spec.ts).
on:
  deployment_status:

permissions:
  contents: read

jobs:
  hud:
    name: HUD panels never overlap
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The commit that was deployed, so the spec matches the page it measures.
      - name: Check out the deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Measure the HUD
        run: npm run test:hud
        env:
          HUD_LAB_URL: ${{ github.event.deployment_status.target_url }}
