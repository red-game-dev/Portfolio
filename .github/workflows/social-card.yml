name: Share card

# The share card recorded from a deployed /social-card/ (scripts/social-card.mjs): the journey as a looping MP4 for
# the platforms that play one, and its last frame as the still the rest show. On a preview whose branch (in this
# repository, never a fork) changed the card, it records that preview and commits the files to the branch. Run it by
# hand to record production again when the figures or the headline change; it commits to a new branch to open as a
# pull request.
#
# The branch's code runs only in the record job, with a token that can read and nothing more. The commit job holds the
# write token, runs nothing from the branch, and takes only the two files the recording made.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: The deployment to record
        default: https://www.redgame.dev
        required: true

permissions:
  contents: read

jobs:
  decide:
    name: Decide whether to record
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      record: ${{ steps.decide.outputs.record }}
      branch: ${{ steps.decide.outputs.branch }}
      sha: ${{ steps.decide.outputs.sha }}
      url: ${{ steps.decide.outputs.url }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Only a branch of this repository that changed the card, never the commit that recorded it.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.deployment.sha || github.sha }}
          PREVIEW: ${{ github.event.deployment_status.target_url }}
          INPUT_URL: ${{ inputs.url }}
          RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            { echo "record=true"; echo "branch=chore/share-card-$RUN"; echo "url=$INPUT_URL"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git log -1 --format=%s "$SHA")" = "chore: record the share card" ]; then
            echo "record=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only origin/main..."$SHA" -- src/pages/social-card.tsx src/components/SocialCard \
            src/components/Journey/backdropEngine.ts src/packages/effects/backdrop scripts/social-card.mjs .github/workflows/social-card.yml)
          pull=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.head.repo.full_name == "'"$REPO"'" and .head.sha == "'"$SHA"'")][0] // empty')
          branch=$(echo "$pull" | jq -r '.head.ref // empty')
          if [ -n "$changed" ] && [ -n "$branch" ]; then
            { echo "record=true"; echo "branch=$branch"; echo "url=$PREVIEW"; } >> "$GITHUB_OUTPUT"
          else
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi

  # A newer push to the same branch cancels the recording and commit still going for an older one.
  record:
    name: Record the share card
    needs: decide
    if: needs.decide.outputs.record == 'true'
    concurrency:
      group: share-card-${{ needs.decide.outputs.branch }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies, Chromium and ffmpeg
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Record
        run: node scripts/social-card.mjs
        env:
          SOCIAL_CARD_URL: ${{ needs.decide.outputs.url }}

      - name: Keep the recording
        uses: actions/upload-artifact@v7
        with:
          name: share-card
          path: |
            public/images/social-card.mp4
            public/images/social-card.png
          if-no-files-found: error
          retention-days: 3

  commit:
    name: Commit the share card
    needs: [decide, record]
    concurrency:
      group: share-card-${{ needs.decide.outputs.branch }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To start CI on the commit it makes.
      actions: write
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.decide.outputs.branch }}

      - name: Take the recording
        uses: actions/download-artifact@v8
        with:
          name: share-card
          path: ${{ runner.temp }}/share-card

      # Only the two files, and only if they are what they say: nothing the recording made is run here. A branch that has
      # moved on since the recorded commit is left alone, since its own deploy records it; the commit gets CI of its own.
      - name: Commit the card
        env:
          BRANCH: ${{ needs.decide.outputs.branch }}
          FROM: ${{ runner.temp }}/share-card
          SHA: ${{ needs.decide.outputs.sha }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "The branch moved on since the recorded commit; its own deploy records it."
            exit 0
          fi
          file --brief --mime-type "$FROM/social-card.mp4" | grep -qx "video/mp4"
          file --brief --mime-type "$FROM/social-card.png" | grep -qx "image/png"
          cp "$FROM/social-card.mp4" "$FROM/social-card.png" public/images/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public/images/social-card.mp4 public/images/social-card.png
          if git diff --cached --quiet; then
            echo "The card is unchanged."
            exit 0
          fi
          git commit -m "chore: record the share card"
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH" || echo "::warning::CI could not be started on $BRANCH; it can be dispatched once ci.yml on main allows it."
